name: Bug report
description: Report a problem with CUPS Print Server
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve CUPS Print Server.

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.x.x"
    validations:
      required: true

  - type: input
    id: integration_version
    attributes:
      label: Integration version
      placeholder: "v0.1.0-beta.1"
    validations:
      required: true

  - type: input
    id: cups_version
    attributes:
      label: CUPS version
      placeholder: "e.g. 2.4.x"

  - type: textarea
    id: problem
    attributes:
      label: Describe the problem
      description: What happened and what did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste relevant Home Assistant log entries here.
      render: text

  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: Printer model, CUPS setup, screenshots or anything else that may help.
